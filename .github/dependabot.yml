version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - "/examples"
      - "/examples/avatar"
      - "/examples/drive-thru"
      - "/examples/frontdesk"
      - "/examples/healthcare"
      - "/examples/inference"
      - "/examples/survey"
      - "/tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
